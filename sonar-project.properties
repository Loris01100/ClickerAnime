# Analyse SonarQube Cloud lancée par la CI (.github/workflows/ci.yml), pas par l'analyse
# automatique : seule une analyse CI peut importer la couverture. Désactiver « Automatic Analysis »
# dans Administration > Analysis Method du projet, sinon les deux analyses entrent en conflit.
sonar.organization=loris01100
sonar.projectKey=Loris01100_ClickerAnime

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/tests/**
sonar.exclusions=src/**/*.test.ts,src/**/tests/**

# Produit par `npm run test:coverage` (vitest + v8). Le contenu authored (src/data) et les points
# d'entrée CLI du simulateur ne sont pas du code à couvrir : mêmes exclusions que vite.config.ts.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/data/**,src/**/*.cli.ts

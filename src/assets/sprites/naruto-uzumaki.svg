<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" shape-rendering="crispEdges">
  <!-- spiky blond hair, behind head -->
  <polygon fill="#f6d03e" points="
    10,40 8,29 15,32 13,17 19,26 18,9 25,22 25,7
    32,19 39,7 39,22 46,9 45,26 51,17 49,32 56,29 54,40
  "/>

  <!-- neck -->
  <rect x="27" y="44" width="10" height="12" fill="#f0b988"/>

  <!-- face -->
  <ellipse cx="32" cy="35" rx="17" ry="16" fill="#f0b988"/>

  <!-- headband cloth + plate -->
  <rect x="14" y="29" width="36" height="7" rx="1" fill="#16305c"/>
  <rect x="26" y="29" width="12" height="7" fill="#d7dbe0"/>
  <circle cx="32" cy="32.5" r="1.6" fill="#16305c"/>
  <rect x="49" y="30" width="6" height="3" fill="#16305c"/>
  <rect x="9" y="30" width="6" height="3" fill="#16305c"/>

  <!-- eyes -->
  <ellipse cx="25" cy="39" rx="2" ry="2.6" fill="#1a1a1a"/>
  <ellipse cx="39" cy="39" rx="2" ry="2.6" fill="#1a1a1a"/>

  <!-- whisker marks -->
  <g stroke="#c98a5c" stroke-width="1.4" stroke-linecap="round">
    <line x1="13" y1="43" x2="20" y2="42"/>
    <line x1="13" y1="47" x2="20" y2="46.5"/>
    <line x1="13" y1="51" x2="20" y2="50.5"/>
    <line x1="51" y1="43" x2="44" y2="42"/>
    <line x1="51" y1="47" x2="44" y2="46.5"/>
    <line x1="51" y1="51" x2="44" y2="50.5"/>
  </g>

  <!-- small smile -->
  <path d="M28,47 Q32,50 36,47" stroke="#c9895c" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- torso: orange jacket with navy collar/shoulders -->
  <rect x="12" y="52" width="40" height="28" rx="6" fill="#f3701c"/>
  <rect x="12" y="52" width="9" height="12" rx="2" fill="#16305c"/>
  <rect x="43" y="52" width="9" height="12" rx="2" fill="#16305c"/>
  <polygon fill="#16305c" points="24,52 32,68 40,52"/>
  <rect x="30" y="52" width="4" height="26" fill="#d1560f"/>
</svg>

# GitHub ne fait plus que vérifier le code : c'est Cloudflare Workers Builds qui déploie — sur
# `main` pour la production (clickeranime.reesch.com), sur les autres branches pour une URL de
# prévisualisation. Le job `deploy` vers GitHub Pages a été retiré avec ce changement.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

# Le job ne fait que lire le dépôt : le jeton n'a pas à pouvoir écrire, même si le réglage par défaut
# du dépôt le permet. Vite, vitest et Playwright exécutent du code de dépendances avec ce jeton à portée.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Ne laisse pas le jeton dans .git/config, où tout code lancé ensuite pourrait le lire.
          persist-credentials: false
          # Historique complet : SonarQube s'en sert pour le blame et pour délimiter le « nouveau code ».
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # `--ignore-scripts` : aucune dépendance n'exécute de script d'installation ici (seuls esbuild,
      # workerd et fsevents en ont, et tous trois résolvent leur binaire via leur paquet de plateforme).
      # La CI installe donc sans jamais exécuter de code arbitraire d'un paquet.
      - run: npm ci --ignore-scripts
      - run: npm run validate:data
      # Mêmes tests que `npm test`, instrumentés : coverage/lcov.info alimente SonarQube.
      - run: npm run test:coverage
      # Sauté là où le secret n'existe pas : PR venue d'un fork, PR Dependabot. Le jeton n'est posé
      # que sur cette étape, jamais au niveau du job où le code des dépendances pourrait le lire.
      - name: SonarQube Cloud
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - run: npm run build
      # On appelle directement le binaire posé par `npm ci` : pas de verbe npm d'installation sur
      # cette ligne, donc rien qui puisse résoudre, télécharger ni exécuter un paquet. La version
      # est celle figée par package-lock.json, et seuls les navigateurs sont téléchargés ensuite.
      - run: ./node_modules/.bin/playwright install --with-deps firefox
      - run: npm run test:e2e

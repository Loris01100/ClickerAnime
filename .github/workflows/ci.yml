# GitHub ne fait plus que vérifier le code : c'est Cloudflare Workers Builds qui déploie — sur
# `main` pour la production (clickeranime.reesch.com), sur les autres branches pour une URL de
# prévisualisation. Le job `deploy` vers GitHub Pages a été retiré avec ce changement.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps firefox
      - run: npm run test:e2e
